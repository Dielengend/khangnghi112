[build]
  command = "rm -rf node_modules .next && npm install --include=dev && NEXT_DISABLE_TURBOPACK=1 npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_DISABLE_TURBOPACK = "1"
  CI = "true"

[build.cache]
  disable = true

[[plugins]]
  package = "@netlify/plugin-nextjs"
